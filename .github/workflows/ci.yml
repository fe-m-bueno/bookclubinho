name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Um run por ref. Sem isto, cada push ou rerun cria um run novo sem encerrar o
# anterior do mesmo PR: nove jobs por run, dez PRs abertos, e a fila cresce mais
# rápido do que os runners a esvaziam — foi o que travou o CI por horas em
# 2026-08-06, com jobs enfileirados às 18:06 UTC ainda parados às 19:25.
#
# `cancel-in-progress` só vale para pull_request. Em push para master cada commit
# precisa do próprio resultado: cancelar o run anterior deixaria commits já
# integrados sem CI nenhum, que é justamente o histórico que se quer poder
# auditar depois.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Secrets scanning ─────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── SAST / supply chain ──────────────────────────────────────────────────────
  trivy:
    name: Trivy (deps, IaC, secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Vulnerabilidades em lockfiles (package-lock.json, pyproject) + secrets no working tree.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: "frontend/node_modules,backend/venv,backend/.venv"

      # Misconfigurações de Dockerfile / docker-compose / GitHub Actions.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          skip-dirs: "frontend/node_modules,backend/venv,backend/.venv"

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # `semgrep scan` (não `semgrep ci`) para não exigir SEMGREP_APP_TOKEN.
      # --error faz o job falhar quando há findings.
      - run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error \
            --metrics off \
            --skip-unknown-extensions

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookclub
          POSTGRES_PASSWORD: bookclub
          POSTGRES_DB: bookclub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookclub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bookclub:bookclub@localhost:5432/bookclub_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      FERNET_KEY: ${{ secrets.CI_FERNET_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
      ENVIRONMENT: test
      DEBUG: "false"
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: bookclub
      S3_PUBLIC_URL: http://localhost:9000/bookclub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q

  backend-audit:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install pip-audit
      # Audita as dependências resolvidas de verdade. `-r requirements.txt` auditava
      # apenas sentry-sdk, já que as deps reais vivem no pyproject.toml.
      # --skip-editable ignora o próprio bookclub-api, que não existe no PyPI.
      - run: pip install -e "."
      - run: pip-audit --skip-editable

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend lint (eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # O backend tinha job de teste desde sempre; o frontend só tinha lint e audit,
  # então os testes do vitest só rodavam se alguém lembrasse de rodá-los na mão.
  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-audit:
    name: Frontend dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # A árvore está em zero vulnerabilidades; `high` mantém o nível.
      - run: npm audit --audit-level=high
