name: Notification worker

# O daemon de `app/workers/notification.py` não tinha onde morar: Background
# Worker no Render é plano pago, e o serviço está no free. Resultado, ninguém
# nunca o iniciou e o /health reportava `notification_worker: error` desde
# sempre.
#
# Aqui ele roda em lote: acorda, drena o stream de notificações, manda os
# lembretes de encontro vencidos e sai. Nada se perde entre corridas — o stream
# é lido por consumer group, então o que chega com o worker fora fica pendente.
# O preço é latência: até um intervalo de atraso, mais o que o agendador do
# GitHub atrasar por conta própria (ele é best-effort e em horário de pico
# costuma passar dos 5 minutos).
#
# Actions é gratuito e sem teto de minutos aqui porque o repositório é público.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # para rodar à mão e ver o resultado sem esperar o cron

concurrency:
  # Duas corridas ao mesmo tempo competiriam pelo mesmo consumer group e pelo
  # mesmo sorted set de lembretes. Uma de cada vez, e a nova espera a anterior.
  group: notification-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Drenar notificações e lembretes
        working-directory: backend
        env:
          # `DATABASE_URL` e **não** `DATABASE_APP_URL`, de propósito.
          #
          # O worker roda sem usuário no contexto: ele lê membros, encontros e
          # RSVPs para decidir a quem escrever, e nenhuma política de RLS
          # autoriza isso sem `app.current_user_id`. Com o papel restrito ele
          # simplesmente não veria linha nenhuma e não mandaria e-mail nenhum,
          # em silêncio.
          #
          # É um job de sistema, não uma requisição de usuário — por isso usa o
          # papel privilegiado. Como `app/db/engine.py` só prefere a restrita
          # quando `DATABASE_APP_URL` existe, basta não declará-la aqui.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          APP_URL: ${{ vars.APP_URL }}
          ENVIRONMENT: production
        run: python -m app.workers.notification --once
